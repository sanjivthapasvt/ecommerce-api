<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Your OTP Code</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f6f7;
        padding: 20px;
        margin: 0;
      }

      .container {
        max-width: 480px;
        margin: auto;
        background: #ffffff;
        padding: 24px;
        border-radius: 12px;
        border: 1px solid #e1e1e1;
      }

      .otp-box {
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 6px;
        text-align: center;
        background: #eef3ff;
        border: 2px dashed #3267e3;
        padding: 16px 0;
        border-radius: 6px;
        color: #3267e3;
        margin: 24px 0;
      }

      p {
        margin-bottom: 16px;
        font-size: 16px;
        line-height: 1.4;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <p>Hi {{firstName}} {{lastName}},</p>

      <p>Your one-time password (OTP) is:</p>

      <div class="otp-box">{{otp}}</div>

      <p>This code is valid till <strong>{{expiresAt}}</strong>.</p>

      <p>If you didn't request this, you can safely ignore this email.</p>

      <p>Thank you,<br />Support Team</p>
    </div>
  </body>
</html>
